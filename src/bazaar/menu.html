<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Fika Holiday Bazaar Menu</title>
</head>

<body>
    <div class="container">
        <!-- Snowflake decorations - SVG files loaded via CSS -->
        <div class="snowflake snowflake-1 snowflake-design-a"></div>
        <div class="snowflake snowflake-2 snowflake-design-b"></div>
        <div class="snowflake snowflake-3 snowflake-design-a"></div>
        <div class="snowflake snowflake-4 snowflake-design-b"></div>
        <div class="snowflake snowflake-5 snowflake-design-a"></div>
        <div class="snowflake snowflake-6 snowflake-design-b"></div>

        <div class="header">
            <h1 class="brand">fika</h1>
            <span class="divider">|</span>
            <h1 class="title">Holiday Bazaar</h1>
        </div>

        <div class="column-left">
            <div class="section">
                <h2 class="section-title">LATTES</h2>
                <ul class="menu-items">
                    <li>Eggnog</li>
                    <li>Vanilla</li>
                </ul>
            </div>

            <div class="section">
                <h2 class="section-title">MOCHAS</h2>
                <ul class="menu-items">
                    <li>Regular</li>
                    <li>Peppermint</li>
                </ul>
            </div>

            <div class="section">
                <h2 class="section-title">DRIP COFFEE</h2>
                <ul class="menu-items">
                    <li>Regular & Decaf</li>
                </ul>
            </div>
        </div>

        <div class="column-right">
            <div class="section">
                <h2 class="section-title">HOT CHOCOLATE</h2>
                <ul class="menu-items">
                    <li>Whole Milk Only</li>
                </ul>
            </div>

            <div class="section">
                <h2 class="section-title">TEA</h2>
                <ul class="menu-items">
                    <li>Regular & Decaf</li>
                </ul>
            </div>

            <div class="section">
                <h2 class="section-title">DAIRY OPTIONS</h2>
                <ul class="menu-items">
                    <li>Whole Milk Only</li>
                </ul>
            </div>

            <div class="section">
                <h2 class="section-title">PRICES</h2>
                <div class="prices">
                    <div class="price-row">
                        <span>12oz : $5</span>
                        <span class="price-inline">Tea & Drip Coffee : $2</span>
                    </div>
                    <div>16oz : $7</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
