<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Fika Holiday Bazaar Menu</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="brand">fika</h1>
            <h1 class="title">Holiday Bazaar</h1>
        </div>

        <div class="menu-grid">
            <div class="column-left">
                <div class="section">
                    <h2 class="section-title">LATTES</h2>
                    <ul class="menu-items">
                        <li>Eggnog</li>
                        <li>Vanilla</li>
                    </ul>
                </div>

                <div class="section">
                    <h2 class="section-title">MOCHAS</h2>
                    <ul class="menu-items">
                        <li>Regular</li>
                        <li>Peppermint</li>
                    </ul>
                </div>

                <div class="section">
                    <h2 class="section-title">DRIP COFFEE</h2>
                    <ul class="menu-items">
                        <li>Regular & Decaf</li>
                    </ul>
                </div>
            </div>

            <div class="column-right">
                <div class="section">
                    <h2 class="section-title">HOT CHOCOLATE</h2>
                    <ul class="menu-items">
                        <li>Whole Milk Only</li>
                    </ul>
                </div>

                <div class="section">
                    <h2 class="section-title">TEA</h2>
                    <ul class="menu-items">
                        <li>Regular & Decaf</li>
                    </ul>
                </div>

                <div class="section">
                    <h2 class="section-title">DAIRY OPTIONS</h2>
                    <ul class="menu-items">
                        <li>Whole Milk Only</li>
                    </ul>
                </div>

                <div class="section">
                    <h2 class="section-title">PRICES</h2>
                    <div class="prices">
                        <p>12oz : $5</p>
                        <p>16oz : $7</p>
                        <p>Tea & Drip Coffee : $2</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
